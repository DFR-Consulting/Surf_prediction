[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "surf-prediction"
version = "0.1.0"
description = "Prédicteur de qualité de surf : prévisions de vagues, vent, températures, pression et score 0-100 (données Open-Meteo)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
surf-prediction = "surf_prediction.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
